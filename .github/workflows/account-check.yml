name: account check

on:
  push:
    branches: [main]
    paths: [".github/workflows/account-check.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: read-only account check (posts to Discord, logs nothing private)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os, requests, account_watch as aw
          s = requests.Session()
          hook = os.environ.get("DISCORD_WEBHOOK", "")
          post = lambda p: s.post(hook, json=p, timeout=6) if hook else None
          print("keys present:", aw.enabled())
          aw.check(s, post)
          PY
      - name: commit data (merge-safe)
        run: |
          git config user.name "polybot"
          git config user.email "polybot@users.noreply.github.com"
          rm -rf /tmp/ours && cp -r data /tmp/ours
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python sync_data.py /tmp/ours data
            git add -A data/
            git diff --cached --quiet && exit 0
            git commit -q -m "polybot data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
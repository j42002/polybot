name: test ticket

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: send one TEST ticket to Discord
        run: python agent.py --test-ticket
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

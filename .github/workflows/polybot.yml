name: polybot

on:
  schedule:
    - cron: "*/20 * * * *"
  push:
    branches: [main]
    paths: [".github/workflows/polybot.yml", "agent.py"]
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes to run (test = 10)"
        default: "10"

permissions:
  contents: write
  actions: write

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: polybot
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: scout (paper only, never trades)
        run: python agent.py
        env:
          RUN_MINUTES: ${{ github.event.inputs.minutes || '55' }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          POLYMARKET_KEY_ID: ${{ secrets.POLYMARKET_KEY_ID }}
          POLYMARKET_SECRET_KEY: ${{ secrets.POLYMARKET_SECRET_KEY }}
      - name: grade
        run: python grade.py
        continue-on-error: true
      - name: commit data (merge-safe)
        run: |
          git config user.name "polybot"
          git config user.email "polybot@users.noreply.github.com"
          rm -rf /tmp/ours && cp -r data /tmp/ours
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python sync_data.py /tmp/ours data
            git add -A data/
            git diff --cached --quiet && exit 0
            git commit -q -m "polybot data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
      - name: queue the next run (keeps it going even if the cron schedule is slow)
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.minutes == '55') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run polybot.yml --repo ${{ github.repository }} --ref main -f minutes=55
